<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打开 Studio 邀请链接</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f6f8;
        color: #1f2329;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1f2329; color: #f5f6f8; }
      }
      main {
        width: min(92vw, 460px);
        padding: 2rem;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        main { background: #2b2f36; box-shadow: none; }
      }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p.hint { margin: 0 0 1.5rem; opacity: 0.75; line-height: 1.6; }
      label { display: block; font-size: 0.9rem; margin-bottom: 0.4rem; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.7rem 0.8rem;
        font-size: 1rem;
        border: 1px solid #c9cdd4;
        border-radius: 8px;
      }
      button {
        margin-top: 1rem;
        width: 100%;
        padding: 0.75rem;
        font-size: 1rem;
        color: #fff;
        background: #1677ff;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover { background: #0958d9; }
      .message { margin-top: 1rem; line-height: 1.6; word-break: break-all; }
      .message:empty { display: none; }
      .error { color: #d4380d; }
      .success { color: #389e0d; }
      a { color: #1677ff; }
      code { font-size: 0.85em; }
    </style>
  </head>
  <body>
    <main>
      <h1>打开 Studio 邀请链接</h1>
      <p class="hint">
        输入邀请码后，程序会校验它并自动在浏览器中打开对应的 Studio 邀请链接。
      </p>
      <form id="invite-form" novalidate>
        <label for="code">邀请码</label>
        <input
          id="code"
          name="code"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="例如：G-AG8p4FpnpAu83F_vJ1ND0aJ"
          data-testid="code-input"
        />
        <button type="submit" data-testid="submit-button">打开邀请链接</button>
      </form>
      <div id="error" class="message error" role="alert" data-testid="error"></div>
      <div id="success" class="message success" data-testid="success"></div>
    </main>

    <script type="module">
      import { buildInviteUrl, validateInviteCode } from './invite.js';

      const form = document.getElementById('invite-form');
      const input = document.getElementById('code');
      const errorBox = document.getElementById('error');
      const successBox = document.getElementById('success');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        errorBox.textContent = '';
        successBox.textContent = '';

        const url = buildInviteUrl(input.value);
        if (url === null) {
          // Invalid or empty code: show a clear error and open nothing.
          errorBox.textContent = validateInviteCode(input.value).message;
          return;
        }

        // Valid code: open the invite link in a new browser tab.
        window.open(url, '_blank', 'noopener');

        const link = document.createElement('a');
        link.href = url;
        link.textContent = url;
        link.rel = 'noopener';
        successBox.append('邀请码有效，已尝试打开链接：', link);
      });
    </script>
  </body>
</html>
